<style>
* {

}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #eef5ff 0%, #ffffff 48%, #f4f7fb 100%);
    color: #0b2855;
    display: flex;
    justify-content: center;
    padding: 28px 18px;

.container {

    max-width: 430px;
    text-align: center;
}

/* LOGO */

.logo {
    width: 220px;
    max-width: 78%;
    display: block;
    margin: 0 auto 8px;
}

h1 {

    margin: 4px 0 7px;

.tagline {
    margin: 0 auto 8px;

    color: #3e4e63;
}

.location {
    margin: 0 0 22px;
    font-size: 14px;
    color: #758091;
}

/* WHATSAPP PRINCIPAL */

.whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 62px;
    padding: 15px 18px;
    background: #25D366;
    color: white;
    text-decoration: none;
    border-radius: 16px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 5px 14px rgba(0,0,0,.13);
    transition: transform .2s;
}

.whatsapp:hover {
    transform: translateY(-2px);
}

/* SERVICIOS */

.services {
    margin: 21px 0 20px;
    padding: 15px 10px;
    background: rgba(255,255,255,.8);
    border-radius: 14px;
    border: 1px solid #dce5f0;
}

.services-title {
    margin: 0 0 9px;
    font-size: 14px;
    font-weight: bold;
    color: #0b2855;
}

.services-text {
    margin: 0;
    font-size: 14px;
    color: #536174;
    line-height: 1.6;
}

/* REDES */

.follow {
    margin: 5px 0 12px;
    font-size: 14px;
    font-weight: bold;
    color: #657186;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.socials {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.social {
    min-height: 70px;
    padding: 11px 4px;
    background: white;
    border: 1px solid #d7e0ec;
    border-radius: 14px;
    text-decoration: none;
    color: #0b2855;
    font-size: 12px;
    font-weight: bold;
    box-shadow: 0 3px 9px rgba(0,0,0,.06);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    transition: .2s;
}

.social:hover {
    transform: translateY(-2px);
    border-color: #0b2855;
}

.social-icon {
    width: 27px;
    height: 27px;
    margin: 0 auto;
    display: block;
    color: #0b2855;
}

/* FOOTER */

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #7b8594;
    line-height: 1.5;

.paw {
