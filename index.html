<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>K-NIDOS | Adiestramiento Canino de Nogales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      color: #0b2855;
      display: flex;
      justify-content: center;
      padding: 35px 18px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 190px;
      max-width: 70%;
      margin-bottom: 12px;
    }

    h1 {
      margin: 5px 0 4px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: bold;
    }

    .location {
      margin: 0 0 25px;
      color: #666;
      font-size: 14px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      margin: 13px 0;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      background: white;
      color: #0b2855;
      border: 2px solid #0b2855;
      box-shadow: 0 3px 8px rgba(0,0,0,.08);
      transition: .2s;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #0b2855;
      color: white;
    }

    .whatsapp {
      background: #25D366;
      border-color: #25D366;
      color: white;
    }

    .footer {
      margin-top: 28px;
      font-size: 13px;
      color: #777;
    }

    .paw {
      font-size: 28px;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

  <main class="container">

    <img src="logo.jpeg"
         alt="K-NIDOS Adiestramiento Canino"
         class="logo">

    <h1>K-NIDOS</h1>

    <p class="subtitle">
      Adiestramiento Canino
    </p>

    <p class="location">
      Nogales, Sonora
    </p>

    <a class="button whatsapp"
       href="https://wa.me/qr/SJUDR4IXUDXMG1"
       target="_blank">
       💬 WhatsApp
    </a>

    <a class="button"
       href="https://www.facebook.com/share/1Jzssgs9i3/"
       target="_blank">
       📘 Facebook
    </a>

    <a class="button"
       href="https://www.instagram.com/knidos_nogales"
       target="_blank">
       📸 Instagram
    </a>

    <a class="button"
       href="https://www.tiktok.com/@knidos.adiestrami"
       target="_blank">
       ♪ TikTok
    </a>

    <div class="footer">
      <div class="paw">🐾</div>
      K-NIDOS · Adiestramiento Canino de Nogales
    </div>

  </main>

</body>
</html>
